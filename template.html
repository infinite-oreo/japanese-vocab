<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日语单词本</title>
<style>
:root{--bg:#f3eee4;--card:#fbf8f1;--fg:#2a2a33;--sub:#8b8579;--line:#dfd7c6;--accent:#a43d30;--zh:#34557a;--chip:#ece5d4;--rt:#4a4a58;--head:#2e3d57;--head-fg:#f3eee4;--serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Songti SC",serif}
@media (prefers-color-scheme:dark){:root{--bg:#15161b;--card:#1d1f26;--fg:#e7e3d8;--sub:#8d897f;--line:#31343d;--accent:#dc866f;--zh:#8fb1d6;--chip:#292c36;--rt:#c4c0b4;--head:#262f43;--head-fg:#ece7da}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","PingFang SC","Noto Sans CJK JP",sans-serif;line-height:1.6}
#side{position:fixed;top:0;left:0;bottom:0;width:260px;overflow:auto;padding:16px;border-right:1px solid var(--line);background:var(--card);font-size:14px}
#side .toc-part{font-family:var(--serif);font-weight:700;margin:4px 0 10px;color:var(--accent)}
#side a{display:block;color:var(--fg);text-decoration:none;padding:3px 0}
#side .toc-l{font-weight:600;margin-top:8px}
#side .toc-s{padding-left:16px;color:var(--sub)}
#side a:hover{color:var(--accent)}
main{margin-left:260px;max-width:860px;padding:20px 28px 80px}
#bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
#bar button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--fg);cursor:pointer}
#bar button.on{background:var(--head);color:var(--head-fg);border-color:var(--head)}
#bar button:hover{border-color:var(--accent)}
h1.part{font-family:var(--serif);font-size:24px;margin:28px 0 4px;letter-spacing:.06em}
h2.lesson{font-family:var(--serif);font-size:22px;margin:34px 0 4px;padding:12px 18px;background:linear-gradient(135deg,var(--head),#44587a);color:var(--head-fg);border-radius:10px;letter-spacing:.04em}
h1 small,h2 small{display:block;font-size:13px;font-weight:400;color:var(--sub);margin-top:2px}
h2 small{color:#c9cfdb;letter-spacing:0}
h2.lesson rt{color:#dfe4ee}
h3{font-family:var(--serif);font-size:18px;margin:28px 0 10px;padding-left:12px;border-left:3px solid var(--accent);letter-spacing:.04em}
h4.sub{font-family:var(--serif);font-size:16px;margin:20px 0 8px;font-weight:600}
h4.sub:first-child{margin-top:0}
ol.entries:empty{display:none}
ol.entries{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(60,50,30,.06);overflow:hidden}
.entry{display:grid;grid-template-columns:34px 1fr 1fr;gap:12px;padding:10px 14px;border-bottom:1px dashed var(--line);align-items:start}
.entry:last-child{border:0}
.legend{margin:16px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:14px}
.legend summary{cursor:pointer;font-weight:600;font-family:var(--serif)}
.legend ul{list-style:none;margin:8px 0 4px;padding:0;display:grid;gap:6px}
.legend li{display:flex;align-items:center;gap:14px}
.legend .sym{min-width:64px;text-align:center;font-family:var(--serif);font-size:16px}
.legend .blank{margin:0 11px 0 11px}
.multi{grid-column:2/-1;display:grid}
.mrow{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:center}
.mrow .zh{padding-top:0}
.entry.star{background:var(--chip)}
.entry.star .no{color:var(--accent)}
.no{color:var(--sub);font-family:var(--serif)}
.jp{font-family:var(--serif);font-size:22px;line-height:2.1}
.jp b{color:var(--accent);font-weight:700}
rt{font-family:"Hiragino Sans","PingFang SC",sans-serif;font-size:.56em;font-weight:500;color:var(--rt);letter-spacing:0}
.blank{display:inline-block;width:3.2em;height:1.1em;border:1px solid var(--sub);vertical-align:middle;margin:0 2px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:4px 4px;margin-top:2px}
.sl{color:var(--sub);font-size:17px;padding:0 1px}
.syn{color:var(--accent);margin:0 .12em}
.chip{font-size:19px;background:var(--chip);border-radius:14px;padding:0 11px;line-height:1.9}
.zh{color:var(--zh);font-size:15px;padding-top:4px}
.zh .w{display:inline-block;margin-right:8px;color:var(--sub);font-size:14px}
.prog{grid-column:2/-1;justify-self:end;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);margin-top:-2px}
.prog button{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-size:11px;cursor:pointer;padding:0;line-height:1}
.prog button:hover{border-color:var(--accent);color:var(--accent)}
.prog button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.entry.done .no{color:var(--accent);font-weight:700}
.sync{font-size:12px;color:var(--sub);align-self:center}
#syncdlg{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);padding:18px 22px;max-width:480px;width:calc(100% - 32px)}
#syncdlg::backdrop{background:rgba(0,0,0,.35)}
#syncdlg h3{margin:0 0 8px;font-family:var(--serif);font-size:18px}
#syncdlg .hint{font-size:13px;color:var(--sub);margin:8px 0}
#syncdlg .code{display:flex;gap:8px;align-items:center}
#syncdlg code{flex:1;font-size:13px;background:var(--chip);padding:8px 10px;border-radius:8px;word-break:break-all;user-select:all}
#syncdlg input{width:100%;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#syncdlg .msg{font-size:13px;color:var(--accent);min-height:1.2em;margin:6px 0}
#syncdlg button{font:inherit;font-size:13px;padding:5px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--fg);cursor:pointer}
#syncdlg button:hover{border-color:var(--accent)}
#syncdlg .actions{display:flex;gap:8px;justify-content:flex-end}
body.hide-ruby rt{visibility:hidden}
body.hide-zh .zh:not(.show),body.hide-jp .jp:not(.show){filter:blur(7px);cursor:pointer;user-select:none}
@media (max-width:760px){
 #side{display:none}main{margin:0;padding:12px 14px 60px}
 .entry{grid-template-columns:28px 1fr}.zh{grid-column:2}.mrow{grid-template-columns:1fr;gap:0}.mrow+.mrow{margin-top:6px}
}
@media print{
 @page{margin:14mm}
 .entry{grid-template-columns:30px 1.3fr 1fr!important}.zh{grid-column:auto!important}
 #side,#bar,.prog,.legend{display:none}main{margin:0;max-width:none;padding:0}
 body{background:#fff;color:#000;font-size:11pt}
 :root{--card:#fff;--fg:#000;--line:#bbb;--chip:#eee}
 h2.lesson{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .entry{break-inside:avoid;padding:6px 10px}
 h3{break-after:avoid}
 .jp{font-size:15pt;line-height:2}.chip{font-size:12pt}.zh{font-size:10.5pt}
 body.hide-zh .zh,body.hide-jp .jp{filter:none}body.hide-ruby rt{visibility:visible}
}
</style>
</head>
<body>
<nav id="side">
{{TOC}}
</nav>
<main>
<div id="bar">
 <button data-m="hide-ruby">隐藏振假名</button>
 <button data-m="hide-zh">遮住中文（日→中自测）</button>
 <button data-m="hide-jp">遮住日语（中→日自测）</button>
 <button id="reveal">全部显示</button>
 <span id="sync" class="sync"></span><button id="syncbtn" title="查看或切换同步码">同步码</button>
</div>
{{BODY}}
</main>
<dialog id="syncdlg">
 <h3>同步码</h3>
 <p class="hint">这是本机进度的「钥匙」，请复制保存。在其他设备或浏览器打开本页后，点「同步码」，把它粘贴到下面的输入框，即可看到同一份进度。</p>
 <div class="code"><code id="mycode"></code><button type="button" id="copycode">复制</button></div>
 <p class="hint">切换为别的同步码（会用对方的云端进度替换本机进度）：</p>
 <input id="newcode" placeholder="粘贴另一个同步码" autocomplete="off" spellcheck="false">
 <p id="dlgmsg" class="msg"></p>
 <div class="actions"><button type="button" id="switchcode">切换</button><button type="button" id="closedlg">关闭</button></div>
</dialog>
<script>
const b=document.body;
document.querySelectorAll('#bar button[data-m]').forEach(btn=>btn.onclick=()=>{
  const m=btn.dataset.m;
  if(m==='hide-zh'&&!b.classList.contains('hide-zh')){b.classList.remove('hide-jp');}
  if(m==='hide-jp'&&!b.classList.contains('hide-jp')){b.classList.remove('hide-zh');}
  b.classList.toggle(m);
  document.querySelectorAll('#bar button[data-m]').forEach(x=>x.classList.toggle('on',b.classList.contains(x.dataset.m)));
  document.querySelectorAll('.show').forEach(e=>e.classList.remove('show'));
});
document.getElementById('reveal').onclick=()=>document.querySelectorAll('.zh,.jp').forEach(e=>e.classList.add('show'));
document.querySelectorAll('.zh,.jp').forEach(e=>e.onclick=()=>e.classList.toggle('show'));
const SB_URL='https://vjqjphclshjgfpdufjlx.supabase.co/rest/v1',SB_KEY='sb_publishable_kfmOsM11zIjx1Z2mrJyIeA_z6EN7s9d';
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const readJSON=k=>{try{return JSON.parse(LS.get(k,'{}'))||{}}catch(e){return {}}};
let local=readJSON('jp-progress'),pending=readJSON('jp-pending');
const saveLocal=()=>LS.set('jp-progress',JSON.stringify(local)),savePending=()=>LS.set('jp-pending',JSON.stringify(pending));
function uuid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)})}
let profile=LS.get('jp-profile','');if(!profile){profile=uuid();LS.set('jp-profile',profile);}
const syncEl=document.getElementById('sync');
const setStatus=t=>{syncEl.textContent=t};

async function rpc(fn,body){
  const r=await fetch(SB_URL+'/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status);
  const t=await r.text();return t?JSON.parse(t):null;
}
let flushing=false;
async function flush(){
  if(flushing)return Object.keys(pending).length===0;
  if(!Object.keys(pending).length)return true;
  flushing=true;const snap={...pending};
  try{
    await rpc('set_jp_progress_bulk',{p_profile:profile,p_items:snap});
    for(const k in snap){if(pending[k]===snap[k])delete pending[k];}
    savePending();return true;
  }catch(e){return false}
  finally{flushing=false}
}
async function syncNow(){
  const ok=await flush();
  setStatus(ok?'已同步':'离线，稍后重试');
  if(ok&&Object.keys(pending).length)setTimeout(syncNow,300);   // 同步期间又有新勾选
}
async function pull(){
  setStatus('同步中…');
  if(LS.get('jp-synced','')!=='1'){for(const k in local)pending[k]=local[k];savePending();}  // 首次：把本机已有进度上传
  if(!(await flush())){setStatus('离线，稍后重试');return;}
  LS.set('jp-synced','1');
  try{
    const rows=await rpc('get_jp_progress',{p_profile:profile});
    const o={};(rows||[]).forEach(r=>{o[r.item_key]=r.rounds});
    local=o;saveLocal();
    document.querySelectorAll('.prog').forEach(renderProg);
    setStatus('已同步');
  }catch(e){setStatus('离线，稍后重试')}
}
function setRounds(key,v){
  if(v>0)local[key]=v;else delete local[key];
  saveLocal();pending[key]=v;savePending();
  setStatus('同步中…');syncNow();
}
function renderProg(el){
  const key=el.dataset.key,done=local[key]||0;
  const n=Math.min(Math.max(4,done+1),12);
  el.innerHTML='<span>已背</span>';
  for(let i=1;i<=n;i++){
    const b=document.createElement('button');
    b.textContent=i<=done?'✓':i;b.title='第'+i+'遍'+(i<=done?'（已完成）':'');
    if(i<=done)b.classList.add('on');
    b.onclick=()=>{setRounds(key,(done===i)?i-1:i);renderProg(el);};
    el.appendChild(b);
  }
  el.parentElement.classList.toggle('done',done>0);
}
document.querySelectorAll('.prog').forEach(renderProg);

// 同步码对话框
const dlg=document.getElementById('syncdlg'),msg=document.getElementById('dlgmsg'),newcode=document.getElementById('newcode');
const openDlg=()=>{dlg.showModal?dlg.showModal():dlg.setAttribute('open','')};
const closeDlg=()=>{dlg.close?dlg.close():dlg.removeAttribute('open')};
document.getElementById('syncbtn').onclick=()=>{
  document.getElementById('mycode').textContent=profile;newcode.value='';msg.textContent='';openDlg();
};
document.getElementById('closedlg').onclick=closeDlg;
document.getElementById('copycode').onclick=async e=>{
  const btn=e.target;
  try{await navigator.clipboard.writeText(profile);btn.textContent='已复制';}
  catch(err){
    const r=document.createRange();r.selectNodeContents(document.getElementById('mycode'));
    const sel=getSelection();sel.removeAllRanges();sel.addRange(r);btn.textContent='请按 ⌘C 复制';
  }
  setTimeout(()=>{btn.textContent='复制'},1800);
};
let switchArmed=false;
document.getElementById('switchcode').onclick=()=>{
  const c=newcode.value.trim().toLowerCase();
  if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(c)){msg.textContent='同步码格式不正确';switchArmed=false;return;}
  if(c===profile){msg.textContent='这已经是本机正在使用的同步码';return;}
  if(!switchArmed){msg.textContent='再点一次「切换」确认：本机当前进度会被该同步码对应的云端进度替换。';switchArmed=true;return;}
  switchArmed=false;profile=c;LS.set('jp-profile',c);pending={};savePending();LS.set('jp-synced','1');
  pull();closeDlg();
};
newcode.oninput=()=>{switchArmed=false;msg.textContent='';};

window.addEventListener('online',()=>pull());
setInterval(()=>{if(Object.keys(pending).length)syncNow()},30000);
pull();
</script>
</body>
</html>
